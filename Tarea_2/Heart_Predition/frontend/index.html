<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción de Enfermedad Cardíaca</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #resultado { margin-top: 20px; padding: 15px; text-align: center; border-radius: 4px; display: none; font-weight: bold; }
        .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .peligro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Datos del Paciente</h2>
        <form id="formulario">
            <label>Edad</label>
            <input type="number" id="Age" required>

            <label>Sexo (M/F)</label>
            <select id="Sex">
                <option value="M">Masculino</option>
                <option value="F">Femenino</option>
            </select>

            <label>Tipo de Dolor en el Pecho (ASY, NAP, ATA, TA)</label>
            <select id="ChestPainType">
                <option value="ASY">ASY</option>
                <option value="NAP">NAP</option>
                <option value="ATA">ATA</option>
                <option value="TA">TA</option>
            </select>

            <label>Presión en Reposo</label>
            <input type="number" id="RestingBP" required>

            <label>Colesterol</label>
            <input type="number" id="Cholesterol" required>

            <label>Ayuno de Azúcar (0 o 1)</label>
            <select id="FastingBS">
                <option value="0">0</option>
                <option value="1">1</option>
            </select>

            <label>ECG en Reposo (Normal, ST, LVH)</label>
            <select id="RestingECG">
                <option value="Normal">Normal</option>
                <option value="ST">ST</option>
                <option value="LVH">LVH</option>
            </select>

            <label>Frecuencia Máxima</label>
            <input type="number" id="MaxHR" required>

            <label>Angina por Ejercicio (Y/N)</label>
            <select id="ExerciseAngina">
                <option value="N">No</option>
                <option value="Y">Sí</option>
            </select>

            <label>Depresión ST (Oldpeak)</label>
            <input type="number" step="0.1" id="Oldpeak" required>

            <label>Pendiente ST (Up, Flat, Down)</label>
            <select id="ST_Slope">
                <option value="Up">Up</option>
                <option value="Flat">Flat</option>
                <option value="Down">Down</option>
            </select>

            <button type="submit">Predecir</button>
        </form>
        <div id="resultado"></div>
    </div>

    <script>
        document.getElementById('formulario').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            // Recoger datos del formulario
            const datos = {
                Age: parseInt(document.getElementById('Age').value),
                Sex: document.getElementById('Sex').value,
                ChestPainType: document.getElementById('ChestPainType').value,
                RestingBP: parseInt(document.getElementById('RestingBP').value),
                Cholesterol: parseInt(document.getElementById('Cholesterol').value),
                FastingBS: parseInt(document.getElementById('FastingBS').value),
                RestingECG: document.getElementById('RestingECG').value,
                MaxHR: parseInt(document.getElementById('MaxHR').value),
                ExerciseAngina: document.getElementById('ExerciseAngina').value,
                Oldpeak: parseFloat(document.getElementById('Oldpeak').value),
                ST_Slope: document.getElementById('ST_Slope').value
            };

            // Enviar a la API
            try {
                const respuesta = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();
                const divResultado = document.getElementById('resultado');
                
                divResultado.style.display = 'block';
                if (resultado.prediccion === 1) {
                    divResultado.className = 'peligro';
                    divResultado.innerHTML = `⚠️ ${resultado.mensaje}<br>Probabilidad de riesgo: ${(resultado.probabilidad_riesgo * 100).toFixed(2)}%`;
                } else {
                    divResultado.className = 'exito';
                    divResultado.innerHTML = `✅ ${resultado.mensaje}<br>Probabilidad de riesgo: ${(resultado.probabilidad_riesgo * 100).toFixed(2)}%`;
                }
            } catch (error) {
                alert('Error al conectar con el servidor. Asegúrate de que la API esté corriendo en el puerto 8000.');
            }
        });
    </script>
</body>
</html>
